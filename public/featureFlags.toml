# Feature Flag Configuration
# Mathematical model: F → [0,100] × P(U) × Boolean
# Format: TOML (consistent with project standards)

[feature_flags.server_driven_ui]
# Core Server-Driven UI migration flag
name = "server_driven_ui"
description = "Migrate from thick client to server-driven UI"
enabled = true
percentage = 0  # Start at 0% rollout
rollout_strategy = "gradual"
monitoring_enabled = true

# User-level overrides (empty initially)
user_overrides = []

# A/B testing configuration
ab_test = false
ab_split = 50

# Rollback configuration
rollback_on_error = true
emergency_disable = false

[feature_flags.enhanced_validation]
# Enhanced question validation 
name = "enhanced_validation"
description = "Advanced client-side validation with server verification"
enabled = true
percentage = 25
rollout_strategy = "immediate"

user_overrides = ["testuser1", "admin"]
ab_test = true
ab_split = 30

[feature_flags.performance_monitoring]
# Performance monitoring and analytics
name = "performance_monitoring" 
description = "Enhanced performance tracking and user analytics"
enabled = true
percentage = 50
rollout_strategy = "gradual"

user_overrides = []
ab_test = false

# Performance configuration
[performance]
hash_cache_size = 10000  # Cache size for hash computations
config_reload_interval = 30000  # 30 seconds in milliseconds
session_tracking_enabled = true
metrics_collection_interval = 60000  # 1 minute

# Monitoring hooks configuration
[monitoring]
enabled = true
log_level = "info"
metrics_endpoint = "/api/feature-flags/metrics"
health_check_endpoint = "/api/feature-flags/health"

# Rollout configuration
[rollout]
default_increment = 5  # Default 5% increments
max_rollout_speed = 20  # Maximum 20% per update
min_observation_time = 300000  # 5 minutes between increments
emergency_rollback_enabled = true

# Hash function configuration (based on mathematical analysis)
[hash_function]
prime_multiplier = 37  # Prime number for hash distribution
modulo_base = 100      # Percentage base (0-99 range)
salt = "feature_flags_v1"  # Salt for hash stability