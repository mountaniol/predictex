# QnA Evaluator Configuration
# Generated from app.config.json on 2025-08-16 12:17:02
# Format: TOML v1.0.0
# Documentation: https://toml.io/

# General application settings
[Generic]
question_set_file = "q4.json"
ai_prompt_file = "ai-prompt.txt"


# Frontend configuration
[Frontend]
api_base_url = "/api"
final_report_initial_rows = 30
request_send_delay = 1000


# Backend server configuration
[Backend]
local_api_port = 3001  # Backend API port
ai_provider = "ollama"  # Options: "ollama" or "openai"
ai_provider_commented = "openai"


  # Ollama AI provider settings
  [Backend.ollama]
base_url = "http://localhost:11434"
model = "nous-hermes2:34b"
default_temperature = 0.3
default_max_tokens = 1024
stream = true


  # OpenAI provider settings
  [Backend.openai]
model = "gpt-4-1106-preview"
simple_evaluate_model = "gpt-4-1106-preview"
default_temperature = 0.3
default_max_tokens = 1024


  # Retry logic for API calls
  [Backend.retry_logic]
max_attempts = 5
initial_delay_seconds = 1
max_delay_seconds = 30


  # Web search configuration
  [Backend.web_search]
enabled = true  # Enable/disable this feature
enable_mock_providers = true
default_language = "en"
max_results = 5
timeout = 30
strategy = "smart_routing"


  # AI-powered web search integration
  [Backend.ai_web_search_integration]
enabled = true  # Enable/disable this feature
force_search_all = true
disable_business_filters = true
ai_powered_queries = true
auto_search_triggers = [ "найди", "поищи", "актуальная информация", "последние новости", "что происходит",]
max_search_results_in_context = 5
search_result_format = "markdown"


    # Query classification settings
    [Backend.web_search.classification]
confidence_threshold = 0.7
fallback_strategy = "all_providers"


    # Search cache settings
    [Backend.web_search.cache]
enabled = true  # Enable/disable this feature
db_path = "data/search_cache.db"
default_ttl = 3600
max_entries = 10000
cleanup_interval = 3600


    # Rate limiting configuration
    [Backend.web_search.rate_limiting]
enabled = true  # Enable/disable this feature
requests_per_minute = 60
requests_per_hour = 1000
burst_size = 10


    # DuckDuckGo search provider
    [Backend.web_search.providers.duckduckgo]
enabled = true  # Enable/disable this feature
weight = 0.7
base_url = "https://api.duckduckgo.com/"
html_url = "https://html.duckduckgo.com/html/"
safe_search = "moderate"
region = "us-en"
timeout = 20


    # Wikipedia search provider
    [Backend.web_search.providers.wikipedia]
enabled = true  # Enable/disable this feature
weight = 0.9
language = "ru"
fallback_languages = [ "en",]
max_summary_length = 1000
include_images = false
timeout = 15


    # RSS feed provider
    [Backend.web_search.providers.rss]
enabled = true  # Enable/disable this feature
weight = 0.8
cache_duration = 3600
timeout = 20

[Backend.web_search.providers.rss.feeds]
news = [ "https://rss.rbc.ru/rbcnews/news.rss", "https://tass.ru/rss/v2.xml", "https://www.interfax.ru/rss.asp",]
tech = [ "https://habr.com/ru/rss/hub/programming/all/", "https://www.cnews.ru/inc/rss/news.xml",]
international = [ "https://www.bbc.com/russian/news/rss.xml", "https://russian.rt.com/rss",]
business = [ "https://www.vedomosti.ru/rss/news", "https://www.kommersant.ru/RSS/news.xml",]
